<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
<title>Recipe Index</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Archivo', system-ui, sans-serif;
    color: #201e1d;
    background: #e9e8e8;
  }
  .wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 56px 32px 80px;
  }
  .kicker {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #ae1800;
    font-weight: 800;
    margin-bottom: 10px;
  }
  h1 {
    font-weight: 800;
    font-size: 40px;
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin: 0 0 10px;
  }
  .subtitle {
    font-size: 15px;
    line-height: 1.5;
    color: #443f3e;
    margin: 0 0 32px;
    max-width: 560px;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-bottom: 8px;
  }
  #search {
    font-family: 'Archivo', system-ui, sans-serif;
    font-size: 14px;
    padding: 10px 14px;
    border: 2px solid rgba(32,30,29,0.3);
    background: #f3f2f2;
    color: #201e1d;
    min-width: 220px;
    flex: 1 1 220px;
  }
  #search:focus { outline: none; border-color: #ae1800; }
  .pill {
    font-family: 'Archivo', system-ui, sans-serif;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 9px 16px;
    border: 2px solid rgba(32,30,29,0.3);
    background: #f3f2f2;
    color: #443f3e;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .pill:hover { border-color: #ae1800; }
  .pill.active {
    background: #ae1800;
    border-color: #ae1800;
    color: #fff;
  }
  .count {
    font-size: 12px;
    color: #605d5d;
    margin: 16px 0 24px;
  }
  hr {
    height: 2px;
    border: 0;
    background: rgba(32,30,29,0.4);
    margin: 0 0 28px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }
  .card {
    background: #f3f2f2;
    border: 1px solid rgba(32,30,29,0.15);
    padding: 22px 22px 20px;
    display: flex;
    flex-direction: column;
  }
  .card .kicker { margin-bottom: 8px; }
  .card h3 {
    font-weight: 800;
    font-size: 21px;
    line-height: 1.15;
    margin: 0 0 6px;
  }
  .card .desc {
    font-size: 13px;
    line-height: 1.5;
    color: #443f3e;
    margin: 0 0 16px;
    flex: 1;
  }
  .stat-row {
    display: flex;
    gap: 16px;
    font-size: 11px;
    color: #605d5d;
    margin-bottom: 18px;
    padding-top: 12px;
    border-top: 1px solid rgba(32,30,29,0.15);
  }
  .stat-row strong { color: #201e1d; font-weight: 800; }
  .card-links {
    display: flex;
    gap: 10px;
  }
  .card-links a {
    font-family: 'Archivo', system-ui, sans-serif;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.03em;
    text-decoration: none;
    text-align: center;
    padding: 9px 0;
    flex: 1;
    border: 2px solid #ae1800;
    color: #ae1800;
    transition: background 0.15s, color 0.15s;
  }
  .card-links a:hover { background: #ae1800; color: #fff; }
  .card-links a.primary {
    background: #ae1800;
    color: #fff;
  }
  .card-links a.primary:hover { background: #8c1300; }
  .card-links a.disabled {
    border-color: rgba(32,30,29,0.2);
    color: rgba(32,30,29,0.35);
    cursor: default;
    pointer-events: none;
  }
  .empty {
    font-size: 14px;
    color: #605d5d;
    font-style: italic;
    padding: 40px 0;
    text-align: center;
    display: none;
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="kicker">Recipe Card Library</div>
  <h1>Recipe Index</h1>
  <p class="subtitle">Every recipe card formatted so far, in one place. Filter by category or search by name.</p>

  <div class="controls">
    <input type="text" id="search" placeholder="Search recipes…" oninput="applyFilters()">
    <button class="pill active" data-category="all" onclick="setCategory(this)">All</button>
    <button class="pill" data-category="Pasta / Kids" onclick="setCategory(this)">Pasta / Kids</button>
    <button class="pill" data-category="Rice / One-Pan" onclick="setCategory(this)">Rice / One-Pan</button>
    <button class="pill" data-category="Sides / Mexican" onclick="setCategory(this)">Sides / Mexican</button>
    <button class="pill" data-category="Soup / Noodles" onclick="setCategory(this)">Soup / Noodles</button>
  </div>

  <div class="count" id="count"></div>

  <hr>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">No recipes match your filters.</div>
</div>

<script>
const recipes = [
  { title: 'How to Cook Canned Black Beans', category: 'Sides / Mexican', desc: 'An easy way to season canned black beans into a flavorful side dish in under 20 minutes.', serves: '4', prep: '10 min', cook: '8 min', html: 'Canned_Black_Beans_Recipe.html', pdf: 'Canned_Black_Beans_Recipe.pdf' },
  { title: 'Miso Ramen', category: 'Soup / Noodles', desc: 'A rich, savory weeknight ramen with a deeply flavored miso-sesame broth.', serves: '4', prep: '15 min', cook: '20 min', html: 'Miso_Ramen_Recipe.html', pdf: 'Miso_Ramen_Recipe.pdf' },
  { title: 'One-Pot Toddler Pasta', category: 'Pasta / Kids', desc: 'A simple, one-pot pasta cooked right in broth for a creamy, kid-approved meal.', serves: '4', prep: '5 min', cook: '10 min', html: 'One_Pot_Toddler_Pasta_Recipe.html', pdf: 'One_Pot_Toddler_Pasta_Recipe.pdf' },
  { title: 'Simple Miso Ramen', category: 'Soup / Noodles', desc: 'A clean, minimalist miso ramen you can pull together in 15 minutes flat.', serves: '2', prep: '5 min', cook: '10 min', html: 'Simple_Miso_Ramen_Recipe.html', pdf: 'Simple_Miso_Ramen_Recipe.pdf' },
  { title: 'Skillet Broccoli-Cheddar Rice', category: 'Rice / One-Pan', desc: 'Buttery rice, tender broccoli, and a broiled cheddar crust — all from one pan.', serves: '4', prep: '10 min', cook: '35 min', html: 'Skillet_Broccoli_Cheddar_Rice_Recipe.html', pdf: 'Skillet_Broccoli_Cheddar_Rice_Recipe.pdf' }
];

let activeCategory = "all";

function setCategory(btn) {
  document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
  btn.classList.add("active");
  activeCategory = btn.dataset.category;
  applyFilters();
}

function applyFilters() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const filtered = recipes.filter(r => {
    const matchesCategory = activeCategory === "all" || r.category === activeCategory;
    const matchesSearch = !q || r.title.toLowerCase().includes(q) || r.desc.toLowerCase().includes(q) || r.category.toLowerCase().includes(q);
    return matchesCategory && matchesSearch;
  });
  render(filtered);
}

function render(list) {
  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");
  const count = document.getElementById("count");

  count.textContent = list.length + (list.length === 1 ? " recipe" : " recipes");

  if (list.length === 0) {
    grid.style.display = "none";
    empty.style.display = "block";
    return;
  }
  grid.style.display = "grid";
  empty.style.display = "none";

  grid.innerHTML = list.map(r => `
    <div class="card">
      <div class="kicker">${r.category}</div>
      <h3>${r.title}</h3>
      <p class="desc">${r.desc}</p>
      <div class="stat-row">
        <span><strong>${r.serves}</strong> serves</span>
        <span><strong>${r.prep}</strong> prep</span>
        <span><strong>${r.cook}</strong> cook</span>
      </div>
      <div class="card-links">
        <a href="${r.html}" class="primary" target="_blank">View Card</a>
        ${r.pdf ? `<a href="${r.pdf}" target="_blank" download>Download PDF</a>` : `<a class="disabled">No PDF</a>`}
      </div>
    </div>
  `).join("");
}

render(recipes);
</script>

</body>
</html>
