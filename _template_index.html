<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
<title>Recipe Index</title>
<style>
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body {
    margin: 0;
    font-family: 'Archivo', system-ui, sans-serif;
    color: #201e1d;
    background: #e9e8e8;
  }

  /* ---- Site Nav ---- */
  .site-nav {
    background: #201e1d;
    width: 100%;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .nav-inner {
    max-width: 980px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
  }
  .nav-brand {
    font-weight: 800;
    font-size: 17px;
    letter-spacing: -0.01em;
    color: #fff;
    text-decoration: none;
  }
  .nav-links {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 100%;
  }
  .nav-link {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    text-decoration: none;
    color: rgba(255,255,255,0.85);
    padding: 10px 14px;
    border-radius: 4px;
    transition: background 0.15s, color 0.15s;
  }
  .nav-link:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .nav-item {
    position: relative;
    height: 100%;
    display: flex;
    align-items: center;
  }
  .nav-caret { font-size: 10px; margin-left: 3px; opacity: 0.7; }
  .dropdown-menu {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    background: #f3f2f2;
    border: 1px solid rgba(32,30,29,0.15);
    min-width: 160px;
    padding: 6px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
  }
  .nav-item:hover .dropdown-menu { display: block; }
  .dropdown-menu a {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #201e1d;
    text-decoration: none;
    padding: 9px 12px;
    border-radius: 3px;
  }
  .dropdown-menu a:hover { background: #ae1800; color: #fff; }

  .wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 56px 32px 80px;
  }
  .kicker {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #ae1800;
    font-weight: 800;
    margin-bottom: 10px;
  }
  h1 {
    font-weight: 800;
    font-size: 40px;
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin: 0 0 10px;
  }
  .subtitle {
    font-size: 15px;
    line-height: 1.5;
    color: #443f3e;
    margin: 0 0 32px;
    max-width: 560px;
  }
  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .tag-filter-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tag-filter-group label {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #605d5d;
  }
  #search {
    font-family: 'Archivo', system-ui, sans-serif;
    font-size: 14px;
    padding: 10px 14px;
    border: 2px solid rgba(32,30,29,0.3);
    background: #f3f2f2;
    color: #201e1d;
    width: 260px;
    max-width: 100%;
  }
  #search:focus { outline: none; border-color: #ae1800; }
  #tagFilter {
    font-family: 'Archivo', system-ui, sans-serif;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 10px 16px;
    border: 2px solid #ae1800;
    background: #ae1800;
    color: #fff;
    cursor: pointer;
    border-radius: 2px;
  }
  #tagFilter:focus { outline: none; }
  #tagFilter option { background: #f3f2f2; color: #201e1d; font-weight: 600; }
  .active-filter {
    display: none;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 700;
    color: #443f3e;
    margin-bottom: 20px;
  }
  .active-filter.show { display: flex; }
  .active-filter .chip {
    background: #ae1800;
    color: #fff;
    padding: 6px 10px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    font-size: 11px;
  }
  .active-filter .chip a { color: #fff; text-decoration: none; font-weight: 800; }
  .meta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 0 0 16px;
  }
  .sort-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sort-row label {
    font-size: 11px;
    color: #918d8c;
    letter-spacing: 0.04em;
  }
  #sortSelect {
    font-family: 'Archivo', system-ui, sans-serif;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 10px;
    border: 1px solid rgba(32,30,29,0.25);
    background: transparent;
    color: #605d5d;
    cursor: pointer;
    border-radius: 2px;
  }
  #sortSelect:focus { outline: none; border-color: #ae1800; color: #201e1d; }
  .count {
    font-size: 12px;
    color: #605d5d;
  }
  hr {
    height: 2px;
    border: 0;
    background: rgba(32,30,29,0.4);
    margin: 0 0 28px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }
  .card {
    background: #f3f2f2;
    border: 1px solid rgba(32,30,29,0.15);
    padding: 22px 22px 20px;
    display: flex;
    flex-direction: column;
  }
  .card .categories { margin-bottom: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .card .category {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #ae1800;
    font-weight: 800;
  }
  .card .category + .category::before { content: "•"; margin-right: 6px; color: rgba(32,30,29,0.3); }
  .card .tags { margin: 0 0 10px; display: flex; gap: 5px; flex-wrap: wrap; }
  .card .tag-chip {
    font-size: 10px;
    color: #605d5d;
    background: rgba(32,30,29,0.06);
    padding: 3px 7px;
  }
  .card h3 {
    font-weight: 800;
    font-size: 21px;
    line-height: 1.15;
    margin: 0 0 6px;
  }
  .card .desc {
    font-size: 13px;
    line-height: 1.5;
    color: #443f3e;
    margin: 0 0 16px;
    flex: 1;
  }
  .stat-row {
    display: flex;
    gap: 16px;
    font-size: 11px;
    color: #605d5d;
    margin-bottom: 18px;
    padding-top: 12px;
    border-top: 1px solid rgba(32,30,29,0.15);
  }
  .stat-row strong { color: #201e1d; font-weight: 800; }
  .card-links {
    display: flex;
    gap: 10px;
  }
  .card-links a {
    font-family: 'Archivo', system-ui, sans-serif;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.03em;
    text-decoration: none;
    text-align: center;
    padding: 9px 0;
    flex: 1;
    border: 2px solid #ae1800;
    background: #ae1800;
    color: #fff;
    transition: background 0.15s, color 0.15s;
  }
  .card-links a:hover { background: #8c1300; }
  .empty {
    font-size: 14px;
    color: #605d5d;
    font-style: italic;
    padding: 40px 0;
    text-align: center;
    display: none;
  }
</style>
</head>
<body>

<nav class="site-nav no-print">
  <div class="nav-inner">
    <a class="nav-brand" href="index.html">Recipe Box</a>
    <div class="nav-links">
      <a class="nav-link" href="index.html">Home</a>
      <div class="nav-item">
        <a class="nav-link" href="index.html">Recipes <span class="nav-caret">▾</span></a>
        <div class="dropdown-menu">
          <a href="index.html?category=Breakfast">Breakfast</a>
          <a href="index.html?category=Lunch">Lunch</a>
          <a href="index.html?category=Dinner">Dinner</a>
          <a href="index.html?category=Sides">Sides</a>
          <a href="index.html?category=Snacks">Snacks</a>
        </div>
      </div>
    </div>
  </div>
</nav>

<div class="wrap">
  <div class="kicker">Recipe Card Library</div>
  <h1>Recipe Index</h1>
  <p class="subtitle">Every recipe card formatted so far, in one place. Browse by category from the nav above, search by name, or narrow further by tag.</p>

  <div class="controls">
    <div class="tag-filter-group">
      <label for="tagFilter">Tags</label>
      <select id="tagFilter" onchange="applyFilters()">
        <option value="all">All tags</option>
      </select>
    </div>
    <input type="text" id="search" placeholder="Search recipes…" oninput="applyFilters()">
  </div>

  <div class="active-filter" id="activeFilter">
    <span>Filtering by category:</span>
    <span class="chip"><span id="activeFilterLabel"></span> <a href="index.html" title="Clear filter">✕</a></span>
  </div>

  <div class="meta-row">
    <div class="count" id="count"></div>
    <div class="sort-row">
      <label for="sortSelect">Sort</label>
      <select id="sortSelect" onchange="applyFilters()">
        <option value="az">A–Z</option>
        <option value="za">Z–A</option>
        <option value="newer">Newer</option>
        <option value="older">Older</option>
        <option value="fastest">Fastest</option>
      </select>
    </div>
  </div>

  <hr>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">No recipes match your filters.</div>
</div>

<script>
const CATEGORY_ORDER = ["Breakfast", "Lunch", "Dinner", "Sides", "Snacks"];
function sortByCategory(list) {
  return [...list].sort((a, b) => CATEGORY_ORDER.indexOf(a) - CATEGORY_ORDER.indexOf(b));
}

const recipes = [
{{RECIPES}}
];

function totalMinutes(r) {
  const p = parseInt((r.prep.match(/\d+/) || [0])[0], 10);
  const c = parseInt((r.cook.match(/\d+/) || [0])[0], 10);
  return p + c;
}

recipes.forEach(r => { r.categories = sortByCategory(r.categories); });

// populate tags dropdown
const allTags = [...new Set(recipes.flatMap(r => r.tags))].sort();
const tagSelect = document.getElementById('tagFilter');
allTags.forEach(t => {
  const opt = document.createElement('option');
  opt.value = t;
  opt.textContent = t;
  tagSelect.appendChild(opt);
});

// read ?category= from URL (set by nav dropdown links)
const params = new URLSearchParams(window.location.search);
const activeCategory = params.get('category');
if (activeCategory) {
  document.getElementById('activeFilter').classList.add('show');
  document.getElementById('activeFilterLabel').textContent = activeCategory;
}

function applyFilters() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const tagVal = document.getElementById("tagFilter").value;
  const sortVal = document.getElementById("sortSelect").value;
  let filtered = recipes.filter(r => {
    const matchesCategory = !activeCategory || r.categories.includes(activeCategory);
    const matchesTag = tagVal === "all" || r.tags.includes(tagVal);
    const matchesSearch = !q || r.title.toLowerCase().includes(q) || r.desc.toLowerCase().includes(q) ||
      r.categories.join(' ').toLowerCase().includes(q) || r.tags.join(' ').toLowerCase().includes(q);
    return matchesCategory && matchesTag && matchesSearch;
  });

  filtered = filtered.slice().sort((a, b) => {
    switch (sortVal) {
      case "za": return b.title.localeCompare(a.title);
      case "newer": return new Date(b.dateAdded) - new Date(a.dateAdded);
      case "older": return new Date(a.dateAdded) - new Date(b.dateAdded);
      case "fastest": return totalMinutes(a) - totalMinutes(b);
      case "az":
      default: return a.title.localeCompare(b.title);
    }
  });

  render(filtered);
}

function render(list) {
  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");
  const count = document.getElementById("count");

  count.textContent = list.length + (list.length === 1 ? " recipe" : " recipes");

  if (list.length === 0) {
    grid.style.display = "none";
    empty.style.display = "block";
    return;
  }
  grid.style.display = "grid";
  empty.style.display = "none";

  grid.innerHTML = list.map(r => `
    <div class="card">
      <div class="categories">${r.categories.map(c => `<span class="category">${c}</span>`).join('')}</div>
      <h3>${r.title}</h3>
      <p class="desc">${r.desc}</p>
      <div class="tags">${r.tags.map(t => `<span class="tag-chip">${t}</span>`).join('')}</div>
      <div class="stat-row">
        <span><strong>${r.serves}</strong> serves</span>
        <span><strong>${r.prep}</strong> prep</span>
        <span><strong>${r.cook}</strong> cook</span>
      </div>
      <div class="card-links">
        <a href="${r.html}" target="_blank">View Card</a>
      </div>
    </div>
  `).join("");
}

applyFilters();
</script>

</body>
</html>
